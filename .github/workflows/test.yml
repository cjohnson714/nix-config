name: Configuration Tests

on:
  push:
    branches: [ main, develop, v3 ]
  pull_request:
    branches: [ main, v3 ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  structure-tests:
    name: Structure Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Run basic structure tests
      run: python test-config.py

    - name: Run advanced tests
      run: python test-advanced.py

    - name: Run window manager tests
      run: python test-window-managers.py

  nix-validation:
    name: Nix Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Cachix
      uses: cachix/cachix-action@v12
      with:
        name: nix-config
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Check flake
      run: nix flake check --all-systems

    - name: Validate configurations
      run: |
        for host in athena nixos-vm; do
          echo "Validating $host..."
          nix eval .#nixosConfigurations.$host.config.system.build.toplevel.drvPath
        done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [athena, nixos-vm]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Cachix
      uses: cachix/cachix-action@v12
      with:
        name: nix-config
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Test host configuration
      run: |
        echo "Testing ${{ matrix.host }} configuration..."
        nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
        nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.stateVersion
        nix eval .#nixosConfigurations.${{ matrix.host }}.config.networking.hostName

  report-summary:
    name: Test Summary
    needs: [structure-tests, nix-validation, security-scan, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Generate summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Structure Tests" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ needs.structure-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Nix Validation" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ needs.nix-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Security Scan" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.structure-tests.result }}" == "success" && "${{ needs.nix-validation.result }}" == "success" && "${{ needs.security-scan.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "### ✅ Overall Status: PASS" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Overall Status: FAIL" >> $GITHUB_STEP_SUMMARY
        fi
